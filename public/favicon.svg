<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="6" stroke-opacity="0.45"/>

  <!-- Upper & Lower Acoustic Resonance Arches -->
  <path d="M 120 185 A 180 170 0 0 1 392 185" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-opacity="0.75" filter="url(#cyanGlow)"/>
  <path d="M 145 325 A 160 160 0 0 0 367 325" stroke="#10B981" stroke-width="10" stroke-linecap="round" stroke-opacity="0.7" filter="url(#cyanGlow)"/>

  <!-- Left Side EQ Spectrum Waveform (Cyber Cyan) -->
  <line x1="90" y1="225" x2="90" y2="280" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" stroke-opacity="0.55"/>
  <line x1="135" y1="200" x2="135" y2="305" stroke="#38BDF8" stroke-width="16" stroke-linecap="round" stroke-opacity="0.75"/>
  <line x1="186" y1="175" x2="186" y2="330" stroke="#38BDF8" stroke-width="18" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- Right Side EQ Spectrum Waveform (Acoustic Emerald) -->
  <line x1="326" y1="175" x2="326" y2="330" stroke="#10B981" stroke-width="18" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="377" y1="200" x2="377" y2="305" stroke="#10B981" stroke-width="16" stroke-linecap="round" stroke-opacity="0.75"/>
  <line x1="422" y1="225" x2="422" y2="280" stroke="#10B981" stroke-width="14" stroke-linecap="round" stroke-opacity="0.55"/>

  <!-- Central Cathedral Acoustic Cross -->
  <line x1="256" y1="120" x2="256" y2="390" stroke="url(#cyanEmerald)" stroke-width="36" stroke-linecap="round" filter="url(#cyanGlow)"/>
  <line x1="140" y1="210" x2="372" y2="210" stroke="url(#cyanEmerald)" stroke-width="32" stroke-linecap="round" filter="url(#cyanGlow)"/>
</svg>
