[package]
name = "hkm_audio_apo"
version = "0.2.29"
edition = "2021"

[lib]
name = "hkm_audio_apo"
crate-type = ["cdylib"]

[dependencies]
apo_shared = { path = "../apo_shared" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Apo",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
] }
windows-core = "0.62"
windows-implement = "0.60"
