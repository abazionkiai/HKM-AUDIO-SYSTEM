[package]
name = "church-audio-intelligence"
version = "0.2.6"
description = "Church Audio Intelligence desktop application"
authors = ["HKM Audio System"]
edition = "2021"

[lib]
name = "church_audio_intelligence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tempfile = "3"
